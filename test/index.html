  stop();S.gAsk=1;save();
  function tile(v,l){return '<div class="cell"><small>'+l+'</small><b class="rc lime">'+v+'</b></div>';}
  show('<div style="margin-top:24px"><p class="mut" style="letter-spacing:2px;font-size:12px">PREMIÈRE CARTE GAGNÉE</p><h1 class="rc" style="font-size:42px">NE PERDS PAS TON <span class="lime">GARAGE</span></h1></div>'+
  '<p class="mut" style="line-height:1.5">Pour l\'instant, ta progression n\'existe que sur ce téléphone. Relie un compte Google pour la retrouver si tu le changes ou si tu réinstalles le jeu.</p>'+
  '<div class="grid3">'+tile(level(),"NIVEAU")+tile(S.cards.length,S.cards.length>1?"CARTES":"CARTE")+tile(fr(S.credits),"CRÉDITS")+'</div>'+
  '<p class="fb" id="gfb" role="status"></p><div class="spacer"></div>'+

function choix(){   // le compte Google a déjà une progression : laquelle garder ?
  stop();var R=NET.found;if(!R)return home();var sv=R.sv;
  function col(t,rows,hl){return '<div style="flex:1;min-width:0;border-radius:14px;background:#14161D;border:'+(hl?"2px solid #C8F53C":"1px solid #262A36")+';padding:14px 12px;display:flex;flex-direction:column;gap:8px"><p class="mut" style="font-size:12px;letter-spacing:1px">'+t+'</p>'+rows.map(function(r){return '<div style="display:flex;justify-content:space-between;gap:6px;font-size:14px"><span class="mut">'+r[0]+'</span><span style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+r[1]+'</span></div>';}).join("")+'</div>';}
  show('<div style="margin-top:24px"><p class="mut" style="letter-spacing:2px;font-size:12px">COMPTE GOOGLE DÉJÀ UTILISÉ</p><h1 class="rc" style="font-size:38px">QUELLE PROGRESSION <span class="lime">GARDER</span> ?</h1></div>'+
  '<p class="mut" style="line-height:1.5">Le compte '+esc(maskMail(R.auth.g))+' a déjà une progression sauvegardée. Une seule peut rester sur ce compte.</p>'+
  '<div class="row" style="gap:10px;align-items:stretch">'+col("SUR CE TÉLÉPHONE",[["Pseudo",esc(S.name)],["Niveau",level()],["Cartes",S.cards.length],["Crédits",fr(S.credits)]],false)+col("SUR LE COMPTE GOOGLE",[["Pseudo",esc(sv.name||"")],["Niveau",fr(+sv.lvl||1)],["Cartes",fr(+sv.cards||0)],["Crédits",fr(+sv.credits||0)]],true)+'</div>'+
  '<p class="mut" style="font-size:12px">Sauvegardée '+esc(whenFr(sv.t))+'. La progression non gardée est effacée.</p><p class="fb" id="fb" role="status"></p><div class="spacer"></div>'+
  '<button class="go" data-act="cp-yes" data-m="found"><b class="rc" style="font-size:26px">GARDER CELLE DU COMPTE</b></button>'+
  '<button class="ghost" data-act="cx-phone" style="min-height:52px;font-weight:600">Garder celle de ce téléphone</button>'+
  '<button class="ghost" data-act="cp-no" data-m="found" style="font-size:13px;text-decoration:underline">Annuler</button>');
}
function keepPhone(){   // ce téléphone prend la place de la progression du compte Google
  var R=NET.found,old="";try{old=(JSON.parse(R.sv.d).fb||{}).nk||"";}catch(e){}
  return within(wipeOnline().catch(function(){}),6000).then(function(){
    fbKeep(R.auth.tok,R.auth.rt,R.auth.uid,3000);S.fb.g=R.auth.g;S.fb.nk="";save();NET.top=null;NET.friends=null;NET.found=null;
    return old&&old!==nameKey(S.name)?jpost(fbDoc("/pseudos/"+old),undefined,R.auth.tok,"DELETE").catch(function(){}):0;
  }).then(function(){S.fb.nk=old===nameKey(S.name)?old:"";return nameClaim(S.name);}).then(function(r){if(r==="taken"){S.fb.clash=1;save();}return cloudSave(true);}).then(function(ok){syncMe();return ok;});
}
function cloudCheck(){   // au lancement : un autre téléphone a-t-il sauvegardé après nous ?
  if(!online()||!S.fb.g||G||NET.conflict||NET.found)return;
  fbTok().then(function(tok){return cloudGet(tok,S.fb.uid);}).then(function(sv){
    if(!sv||!sv.d){cloudSave(true);return;}
    if(sv.dev&&sv.dev!==S.fb.dev&&+new Date(sv.t)>(+new Date(S.fb.sv||0)||0)+1000){NET.conflict={sv:sv};if(!G)compte("conflict");}
  }).catch(function(){});
}
function myCode(){if(!S.fb.code){var a=(S.name.toUpperCase().replace(/[^A-Z]/g,"")+"XXXX").slice(0,4),al="23456789ABCDEFGHJKLMNPQRSTUVWXYZ",r="";for(var i=0;i<4;i++)r+=al[Math.floor(Math.random()*al.length)];S.fb.code=a+"-"+r;save();}return S.fb.code;}
function myBest(){return S.scores.length?S.scores[0].p:0;}
function myRow(){return{id:S.fb.uid,name:cleanName(S.name),best:myBest(),lvl:level()};}
function syncMe(){
  if(!online()||!S.name)return Promise.resolve(false);
  var wk=S.wk&&S.wk.id===weekId()?S.wk.p:0;
  return fbTok().then(function(tok){if(S.fb.nk===nameKey(S.name))return tok;return nameClaim(S.name).then(function(r){if(r==="taken"){S.fb.clash=1;save();}return tok;});}).then(function(tok){return jpost(fbDoc("/players/"+S.fb.uid),fenc({name:cleanName(S.name),best:Math.min(4000,myBest()),total:S.xp,week:wk,weekId:weekId(),lvl:level(),cards:S.cards.length,code:myCode(),t:new Date()}),tok,"PATCH");}).then(function(){NET.err="";return true;},function(e){NET.err=String(e.message||e);return false;});
}
function fbQuery(tok,q){return jpost(fbDoc(":runQuery"),{structuredQuery:q},tok).then(function(a){return(a||[]).filter(function(x){return x.document;}).map(function(x){return fdec(x.document);});});}
function loadTop(force){
  if(!force&&NET.top&&Date.now()-NET.topT<120000)return Promise.resolve(NET.top);
  return fbTok().then(function(tok){
    return Promise.all([fbQuery(tok,{from:[{collectionId:"players"}],orderBy:[{field:{fieldPath:"best"},direction:"DESCENDING"}],limit:50}),
      jpost(fbDoc(":runAggregationQuery"),{structuredAggregationQuery:{structuredQuery:{from:[{collectionId:"players"}],where:{fieldFilter:{field:{fieldPath:"best"},op:"GREATER_THAN",value:{integerValue:String(myBest())}}}},aggregations:[{alias:"n",count:{}}]}},tok)]);
  }).then(function(r){var n=0;try{n=+r[1][0].result.aggregateFields.n.integerValue;}catch(e){}NET.top=r[0];NET.rank=n+1;NET.topT=Date.now();return NET.top;});
}
function loadFriends(force){
  if(!force&&NET.friends&&Date.now()-NET.frT<120000)return Promise.resolve(NET.friends);
  var tk;return fbTok().then(function(tok){tk=tok;return fbQuery(tok,{from:[{collectionId:"friendships"}],where:{fieldFilter:{field:{fieldPath:"m"},op:"ARRAY_CONTAINS",value:{stringValue:S.fb.uid}}},limit:100});})
  .then(function(fs){var ids=[];fs.forEach(function(f){(f.m||[]).forEach(function(u){if(u!==S.fb.uid&&ids.indexOf(u)<0)ids.push(u);});});
    if(!ids.length)return [];
    return jpost(fbDoc(":batchGet"),{documents:ids.map(function(u){return "projects/"+FB.pid+"/databases/(default)/documents/players/"+u;})},tk).then(function(a){return(a||[]).filter(function(x){return x.found;}).map(function(x){return fdec(x.found);});});})
  .then(function(l){NET.friends=l;NET.frT=Date.now();return l;});
}
function addFriend(code){
  code=String(code||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(code.length!==8)return Promise.reject(new Error("Un code fait 8 caractères, comme ABCD-1234."));
  code=code.slice(0,4)+"-"+code.slice(4);if(code===myCode())return Promise.reject(new Error("C'est ton propre code."));
  var tk;return fbTok().then(function(tok){tk=tok;return fbQuery(tok,{from:[{collectionId:"players"}],where:{fieldFilter:{field:{fieldPath:"code"},op:"EQUAL",value:{stringValue:code}}},limit:1});})
  .then(function(l){if(!l.length)throw new Error("Aucun joueur avec ce code.");var o=l[0],pair=[S.fb.uid,o.id].sort();
    return jpost(fbDoc("/friendships/"+pair[0]+"_"+pair[1]),fenc({m:pair,t:new Date()}),tk,"PATCH").then(function(){NET.friends=null;return o;});});
}
function wipeOnline(){
  if(!online()||!S.fb.uid)return Promise.resolve();
  var tk;return fbTok().then(function(tok){tk=tok;return fbQuery(tok,{from:[{collectionId:"friendships"}],where:{fieldFilter:{field:{fieldPath:"m"},op:"ARRAY_CONTAINS",value:{stringValue:S.fb.uid}}},limit:100});})
  .then(function(fs){return Promise.all(fs.map(function(f){return jpost(fbDoc("/friendships/"+f.id),undefined,tk,"DELETE").catch(function(){});}));}).catch(function(e){if(!tk)throw e;})
  .then(function(){var nk=S.fb.nk;return Promise.all([nk?jpost(fbDoc("/pseudos/"+nk),undefined,tk,"DELETE").catch(function(){}):0,jpost(fbDoc("/saves/"+S.fb.uid),undefined,tk,"DELETE").catch(function(){})]);})
  .then(function(){return jpost(fbDoc("/players/"+S.fb.uid),undefined,tk,"DELETE");}).then(function(){NET.top=null;NET.friends=null;S.fb.nk="";save();});
}
function sendMod(col,o){if(!online())return;fbTok().then(function(tok){o.uid=S.fb.uid;o.name=cleanName(S.name);o.t=new Date();return jpost(fbDoc("/"+col),fenc(o),tok);}).catch(function(){});}
/* ---------- Défis entre copains : même partie, scores cachés jusqu'à la fin ---------- */
var DEFI_H=24,PODIUM=[60,30,15];
function defiCode(){var al="23456789ABCDEFGHJKLMNPQRSTUVWXYZ",r="";for(var i=0;i<6;i++)r+=al[Math.floor(Math.random()*al.length)];return r;}
function defiPack(it){return it.type==="qcm"?"j|"+JSON.stringify({q:it.q.q,a:it.q.a,e:it.q.e||"",c:it.q.c||"",u:it.q.u||"",d:it.q.d||2,t:it.q.t||""}):"p|"+it.car.n+"|"+(it.zoom?1:0)+"|"+(it.ox||50)+"|"+(it.oy||55);}
function defiUnpack(s){
  if(s.slice(0,2)==="j|"){var o=JSON.parse(s.slice(2));if(!o||!o.q||!o.a||o.a.length<2)return null;return{type:"qcm",q:{q:String(o.q),a:o.a.map(String),e:String(o.e||""),c:o.c||"",u:o.u||"",d:+o.d||2,t:o.t||""}};}
  var p=s.split("|"),car=CARS.filter(function(c){return c.n===p[1];})[0];if(!car||!PHOTOS[car.n])return null;return{type:"photo",car:car,fix:{zoom:p[2]==="1",ox:+p[3]||50,oy:+p[4]||55}};
}
function left(ms){var m=Math.max(0,Math.ceil((ms-Date.now())/60000));return m>=60?Math.floor(m/60)+" h "+("0"+m%60).slice(-2):m+" min";}
function myDefi(id){if(!S.defis)S.defis={};return S.defis[id]||(S.defis[id]={});}
function defiNotify(id,end){try{if(window.PPNative&&PPNative.scheduleNotif)PPNative.scheduleNotif(id,end,"Le défi est terminé !","Le classement est dévoilé : viens voir ta place.");}catch(e){}}
function defiSubmit(){
  var id=G.defi,d=myDefi(id);if(d.played)return Promise.resolve();d.played=true;d.pts=G.pts;save();
  return fbTok().then(function(tok){var nm=cleanName(S.name);
    return jpost(fbDoc("/defis/"+id+"/scores?documentId="+S.fb.uid),fenc({name:nm,pts:Math.min(4000,G.pts),good:G.good,d:G.items.map(function(it){return it.pts||0;}),t:new Date()}),tok)
      .then(function(){return jpost(fbDoc("/defis/"+id+"/joueurs?documentId="+S.fb.uid),fenc({name:nm,t:new Date()}),tok);});
  }).then(function(){defiNotify(id,d.end);},function(e){NET.err=String(e.message||e);d.pending={pts:G.pts,good:G.good,d:G.items.map(function(it){return it.pts||0;})};save();});
}
function defiCreate(){
  if(!online()||!G||!G.end)return Promise.reject(new Error("hors ligne"));
  if(G.defi)return Promise.resolve(G.defi);
  var id=defiCode(),end=Date.now()+DEFI_H*3600000;
  return fbTok().then(function(tok){return jpost(fbDoc("/defis?documentId="+id),fenc({by:S.fb.uid,byName:cleanName(S.name),mode:S.mode,zone:G.z.k,zname:G.z.n,items:G.items.map(defiPack),end:new Date(end),t:new Date()}),tok);})
  .then(function(){G.defi=id;var d=myDefi(id);d.end=end;d.by=S.fb.uid;d.byName=cleanName(S.name);d.mine=true;save();return defiSubmit();}).then(function(){return id;});
}
function defiLink(id){return SITE+"d/?c="+id;}
function defiShare(id){shareText("Je te défie sur Plein Phare ! Même partie, mêmes questions, classement dévoilé dans "+DEFI_H+" h. Code du défi : D-"+id+" · "+defiLink(id));}
function defiLoad(id){var tk,def;return fbTok().then(function(tok){tk=tok;return jpost(fbDoc("/defis/"+id),undefined,tok,"GET");}).then(function(doc){def=fdec(doc);def.endMs=Date.parse(def.end);
  var d=myDefi(id);d.end=def.endMs;d.byName=def.byName;d.by=def.by;save();
  return jpost(fbDoc("/defis/"+id+"/joueurs?pageSize=100"),undefined,tk,"GET");}).then(function(j){def.joueurs=(j.documents||[]).map(fdec);
  if(Date.now()<def.endMs)return def;
  return jpost(fbDoc("/defis/"+id+"/scores?pageSize=100"),undefined,tk,"GET").then(function(s){def.scores=(s.documents||[]).map(fdec).sort(function(a,b){return(b.pts||0)-(a.pts||0);});return def;});});}
function defiView(id){
  stop();G=null;id=String(id||"").toUpperCase().replace(/^D-?/,"").replace(/[^A-Z0-9]/g,"");
  if(!online()||id.length!==6){home();return toast("Défi introuvable.");}
  show('<div class="spacer"></div><p class="mut" style="text-align:center">Chargement du défi…</p><div class="spacer"></div>'+navBar("board"));
  defiLoad(id).then(function(def){NET.defi=def;if(Date.now()>=def.endMs)defiEnd(def);else defiOpen(def);},function(e){home();toast(/NOT_FOUND|404|not found/i.test(e.message)?"Ce défi n'existe pas ou plus.":"Connexion impossible pour le moment.");});
}
function defiOpen(def){
  var d=myDefi(def.id),names=def.joueurs.slice(),me=names.some(function(p){return p.id===S.fb.uid;}),h='<div style="text-align:center;margin-top:6px"><p class="mut" style="font-size:12px;letter-spacing:2px">DÉFI LANCÉ PAR '+esc(cleanName(def.byName).toUpperCase())+'</p><h1 class="rc" style="font-size:36px;line-height:1.05;margin-top:4px">MÊME PARTIE, <span style="color:#29C7F5">MÊMES QUESTIONS</span></h1></div>'+
  '<div class="grid3"><div class="cell"><small>QUESTIONS</small><b class="rc">'+def.items.length+'</b></div><div class="cell" style="border-color:#C8F53C"><small>NIVEAU</small><b class="rc">'+(MODE_N[def.mode]||"")+'</b></div><div class="cell" style="border-color:#FF7A6B"><small>FIN DANS</small><b class="rc">'+left(def.endMs)+'</b></div></div>'+
  '<p class="mut" style="text-align:center;font-size:13px;line-height:1.45">Une seule tentative. Les scores restent cachés jusqu\'à la fin : le classement se dévoile pour tout le monde en même temps.</p>'+
  '<h2 class="rc" style="font-size:16px;letter-spacing:1px">LES PARTICIPANTS · '+(names.length+(d.played||me?0:1))+'</h2><div class="list" style="max-height:26vh;overflow:auto">';
  names.forEach(function(p){h+='<div class="lb"><span>'+esc(cleanName(p.name))+(p.id===def.by?" · a lancé le défi":"")+(p.id===S.fb.uid?" · toi":"")+'</span><small style="color:#C8F53C;font-weight:600">A joué</small></div>';});
  if(!d.played&&!me)h+='<div class="lb me"><span>'+esc(cleanName(S.name))+' · toi</span><small style="color:#FFB020;font-weight:600">À toi de jouer</small></div>';
  h+='</div><div class="spacer"></div>'+(d.started&&!d.played&&!me?'<div class="box" style="text-align:center"><p style="font-weight:600">Tentative interrompue.</p><p class="mut" style="font-size:13px">Un défi ne se joue qu\'une fois : il ne peut pas être relancé.</p></div>':d.played||me?'<div class="box" style="text-align:center"><p style="font-weight:600">Ton score est enregistré.</p><p class="mut" style="font-size:13px">Résultat dans '+left(def.endMs)+'. Tu seras prévenu à la fin du défi.</p></div>':'<button class="go" data-act="defi-go"><b class="rc">RELEVER LE DÉFI</b><small>Consomme '+(S.moto==="el"?"de la batterie":"de l\'essence")+' comme une partie normale</small></button>')+
  '<button class="ghost" data-act="defi-share" data-k="'+def.id+'">Inviter d\'autres copains</button><p class="fb" id="fb" role="status"></p>';
  show(h+navBar("board"));
}
function defiEnd(def){
  var d=myDefi(def.id),sc=def.scores||[],pos=-1;sc.forEach(function(p,i){if(p.id===S.fb.uid)pos=i;});
  var gain=pos>=0&&pos<3&&sc.length>1?PODIUM[pos]:0;if(gain&&!d.paid){d.paid=true;S.credits+=gain;}d.seen=true;save();
  var ord=["1ER","2E","3E"],h='<div style="text-align:center;margin-top:6px"><p class="mut" style="font-size:12px;letter-spacing:2px">DÉFI TERMINÉ · '+sc.length+' PARTICIPANT'+(sc.length>1?"S":"")+'</p><h1 class="rc" style="font-size:44px;line-height:1.05;margin-top:4px">'+(pos<0?'LE <span style="color:#FFB020">CLASSEMENT</span>':'TU ES <span style="color:#FFB020">'+(ord[pos]||(pos+1)+"E")+' !</span>')+'</h1>'+(pos>0?'<p class="mut" style="margin-top:4px">À '+fr((sc[0].pts||0)-(sc[pos].pts||0))+' points du vainqueur</p>':pos===0&&sc.length>1?'<p class="mut" style="margin-top:4px">'+fr((sc[0].pts||0)-(sc[1].pts||0))+' points d\'avance sur le deuxième</p>':'')+'</div><div class="list" style="max-height:38vh;overflow:auto">';
  sc.forEach(function(p,i){var c=["#FFB020","#D5D9E2","#E0A070"][i]||"#B4B9C6",me=p.id===S.fb.uid;h+='<div class="lb'+(me?" me":"")+'" style="min-height:54px"><b class="rc" style="color:'+c+'">'+(i+1)+'</b><span>'+esc(cleanName(p.name))+(p.id===def.by?" · a lancé":"")+(me?" · toi":"")+'<br><small style="font-weight:400">'+(p.good||0)+' sur '+def.items.length+' du premier coup</small></span><b class="rc sc">'+fr(p.pts||0)+'</b></div>';});
  if(!sc.length)h+='<p class="mut" style="text-align:center;padding:14px">Personne n\'a joué ce défi.</p>';
  h+='</div>'+(gain?'<div class="box row sb" style="gap:10px"><div><p style="font-size:14px;font-weight:600">Récompense du podium</p><p class="mut" style="font-size:12px">1er : '+PODIUM[0]+' · 2e : '+PODIUM[1]+' · 3e : '+PODIUM[2]+'</p></div><b class="rc" style="font-size:20px;color:#FFB020;white-space:nowrap">+'+gain+' crédits</b></div>':'')+
  '<div class="spacer"></div><button class="go" data-act="defi-revanche" data-z="'+esc(def.zone||"all")+'" data-m="'+(def.mode||3)+'"><b class="rc" style="font-size:24px">LANCER LA REVANCHE</b><small>Nouvelle partie, puis nouveau défi à partager</small></button><div class="grid2"><button class="ghost" data-act="defi-detail">Question par question</button><button class="ghost" data-act="home">Accueil</button></div>';
  show(h);if(gain)beep(true);
}
function defiDetail(){
  var def=NET.defi;if(!def||!def.scores)return home();
  var h='<div class="row sb" style="min-height:44px"><button class="lnk" data-act="defi-back" style="text-align:left;width:auto">← Retour</button></div><h1 class="rc" style="font-size:28px">QUESTION PAR <span class="lime">QUESTION</span></h1><div class="list">';
  def.items.forEach(function(s,i){var it=defiUnpack(s),t=it?(it.type==="qcm"?it.q.q:"Photo mystère : "+it.car.n):"Question "+(i+1);h+='<div style="padding:10px 14px;border-bottom:1px solid #262A36"><p style="font-size:14px;font-weight:600">'+(i+1)+'. '+esc(t)+'</p><p class="mut" style="font-size:13px">'+def.scores.map(function(p){return esc(cleanName(p.name))+" : "+((p.d||[])[i]||0);}).join(" · ")+'</p></div>';});
  show(h+'</div>');
}
function defiPlay(){
  var def=NET.defi,d=def&&myDefi(def.id);if(!def||d.played||d.started||Date.now()>=def.endMs)return;

  quit:function(){pause();if($("qs"))return;app.insertAdjacentHTML("beforeend",'<div class="sheet" id="qs" role="alertdialog" aria-label="Quitter la partie ?"><p class="rc" style="font-size:24px">QUITTER LA PARTIE ?</p><p class="mut">Tes points de cette partie seront perdus. Les crédits déjà gagnés restent acquis.</p><div class="grid2"><button class="ghost" data-act="quit-yes" style="border-color:#F0766B;color:#F0766B">Quitter</button><button class="ghost" data-act="quit-no" id="qn" style="border-color:#C8F53C;color:#C8F53C">Continuer</button></div></div>');var b=$("qn");if(b&&b.focus)b.focus();},
  "quit-yes":function(){if(G&&G.defi){defiSubmit();if(G.modeBack){S.mode=G.modeBack;save();}}home();},
  "quit-no":function(){var s=$("qs");if(s&&s.parentNode)s.parentNode.removeChild(s);},
  ans:function(el){answer(+el.getAttribute("data-i"));},
  next:nextQ,
  anec:function(el){pause();var t=$("ant");if(t&&t.hidden){t.hidden=false;el.setAttribute("aria-expanded","true");$("anc").textContent="";S.anec++;save();}},
  report:function(){pause();var r=$("rep");if(r&&!r.innerHTML)r.innerHTML='<label class="l" for="rt" style="margin-top:8px">Qu\'est-ce qui cloche ?</label><textarea id="rt" rows="2" maxlength="300"></textarea><button data-act="report-send" class="ghost" style="margin-top:8px;width:100%">Envoyer le signalement</button>';},
  "report-send":function(){var it=G.items[G.i],t=$("rt").value.trim();if(!t){$("rt").focus();return;}S.reports.push({q:it.type==="qcm"?it.q.q:"Photo : "+it.car.n,t:t});sendMod("signalements",{q:(it.type==="qcm"?it.q.q:"Photo : "+it.car.n).slice(0,300),txt:t.slice(0,300)});S.reports=S.reports.slice(-40);save();$("rep").innerHTML='<p class="mut" style="margin-top:8px">Merci, c\'est noté.</p>';},
  "jk-50":function(){var it=G.items[G.i];if(it.done||S.credits<40)return;var wrong=shuffle(it.list.filter(function(a){return a!==it.good&&it.out.indexOf(a)<0;}));if(wrong.length<2)return;S.credits-=40;wrong.slice(0,wrong.length-1).forEach(function(a){it.out.push(a);});it.fifty=true;save();var k=it.left;noFocus=true;renderQ();it.left=k;paintTimer(it);[].forEach.call(app.querySelectorAll(".ans .ko span:last-child"),function(s){s.textContent=s.textContent.replace(" · raté"," · écarté");});},
  "jk-skip":function(){var it=G.items[G.i];if(it.done||S.credits<100)return;S.credits-=100;save();it.done=true;it.skip=true;it.pts=0;it.first=false;nextQ();},
  "jk-net":function(){var it=G.items[G.i];if(it.done||it.type!=="photo")return;pub("Après la pub, l'image devient nette.",function(){it.clear=true;var k=it.left;renderQ();it.left=k;it.clear=true;var ph=$("ph");if(ph){ph.style.filter="none";ph.style.transform="none";}paintTimer(it);});},
  "jk-shield":function(){var it=G.items[G.i];if(it.done||it.shield||it.type==="photo"||G.shields>=MAX_SHIELDS)return;pub("Après la pub, ta prochaine erreur sur cette question ne coûte rien.",function(){it.shield=true;G.shields++;var k=it.left;renderQ();it.left=k;paintTimer(it);});},
  "refill-ad":function(){pub("Après la pub, tu repars avec la moitié du "+(S.moto==="el"?"niveau de batterie":"réservoir")+".",function(){S.fuel=Math.max(S.fuel,TANK/2);S.fuelT=Date.now();save();G?renderQ():home();});},
  "refill-pay":function(){var pr=fullPrice(),today=dkey(new Date());if(S.credits<pr)return;S.credits-=pr;S.refN=(S.refDay===today?(S.refN||0):0)+1;S.refDay=today;S.fuel=TANK;S.fuelT=0;save();G?renderQ():home();},
  "refill-wait":function(){regen();if(S.fuel>0&&G)renderQ();else panne();},
  card:function(el){cardView(el.getAttribute("data-k"));},
  bilan:function(){if(G&&G.end)bilan(false);else home();},recap:function(){if(G&&G.end)recap();},
  "daily-ok":function(el){var st=+el.getAttribute("data-st")||1,d=(st-1)%7,today=dkey(new Date());if(S.bDay===today)return home();S.bDay=today;S.streak=st;S.credits+=BONUS[d];
    var won=null;if(d===6){var fr1=Object.keys(CARDS).filter(function(k){return S.cards.indexOf(k)<0&&PHOTOS[k];}),rare=fr1.filter(function(k){return CARDS[k].r===1;}),pool=rare.length?rare:fr1;if(pool.length){won=pool[Math.floor(Math.random()*pool.length)];S.cards.push(won);}}
    save();beep(true);if(won){G={good:0,items:[],pts:0,z:zone("all")||ZONES[0],end:{n:0,daily:true}};dailyCard(won);}else home();},
  share:function(){shareText(G&&G.share||"Viens jouer à Plein Phare !");},
  "share-card":function(el){var k=el.getAttribute("data-k");shareText("J'ai décroché la carte « "+k+" » ("+RAR[CARDS[k].r]+") dans Plein Phare.");},
  pace:function(){var i=0;PACES.forEach(function(x,j){if(x[0]===S.pace)i=j;});S.pace=PACES[(i+1)%PACES.length][0];save();profil();},
  ext:function(el){try{window.open(el.getAttribute("data-u"),"_blank");}catch(e){}},
  privacy:function(){try{window.PPNative.showPrivacyOptions();}catch(e){}},
  reset:function(el){if(el.getAttribute("data-sure")){var done=function(){try{localStorage.removeItem("pleinphare2");}catch(e){}location.reload();};wipeOnline().then(done,done);return;}el.setAttribute("data-sure","1");el.querySelector(".v").textContent="Toucher encore pour confirmer";},
  "prop-send":function(){var q=$("pq").value.trim(),a=[$("p0").value.trim(),$("p1").value.trim(),$("p2").value.trim(),$("p3").value.trim()],fb=$("fb");
    if(!q||a.some(function(x){return !x;})){fb.textContent="Il manque la question ou une des quatre réponses.";fb.style.color="#F0766B";return;}
    S.props.push({c:$("pc").value,q:q,a:a,s:$("ps").value.trim()});sendMod("propositions",{c:$("pc").value,q:q.slice(0,300),a:a.map(function(x){return x.slice(0,120);}),s:$("ps").value.trim().slice(0,200)});S.props=S.props.slice(-40);save();proposer();$("fb").textContent="Proposition enregistrée. Merci !";$("fb").style.color="#4CC38A";}
};
app.addEventListener("click",function(ev){var el=ev.target;while(el&&el!==app&&!(el.getAttribute&&el.getAttribute("data-act")))el=el.parentNode;if(!el||el===app||el.disabled)return;var f=ACT[el.getAttribute("data-act")];if(f)f(el);});
app.addEventListener("change",function(ev){var k=ev.target&&ev.target.getAttribute&&ev.target.getAttribute("data-tog");if(k){S[k]=!!ev.target.checked;save();}});
window.__back=function(){if($("qs")){ACT["quit-no"]();return 1;}if(G&&document.querySelector('[data-act="quit"]')){ACT.quit();return 1;}if(G)return 1;var on=document.querySelector("nav button.on");if(on&&on.getAttribute("data-act")==="home")return 0;if(!S.name)return 0;home();return 1;};
function setVh(){try{document.documentElement.style.setProperty("--vh",window.innerHeight+"px");}catch(e){}}
setVh();if(window.addEventListener)window.addEventListener("resize",setVh);
function intro(){var el=$("intro");if(!el)return;var seen=0;try{seen=sessionStorage.getItem("ppIntro");sessionStorage.setItem("ppIntro","1");}catch(e){}
  var done=0,end=function(){if(done)return;done=1;el.className="out";setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},300);};
  if(seen){done=1;el.parentNode.removeChild(el);return;}
  el.addEventListener("click",end);
  var calm=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(!calm){setTimeout(function(){tone(1400,900,0.05,"square",0.025);},600);setTimeout(function(){tone(1500,1000,0.05,"square",0.025);},1000);setTimeout(function(){tone(180,620,0.55,"triangle",0.05);},1090);}
  setTimeout(end,calm?1400:4000);}
var BUILD="30";
load();contentBoot();home();intro();setTimeout(contentSync,1500);setTimeout(cloudCheck,2500);
document.addEventListener("visibilitychange",function(){if(document.hidden)cloudSave(false);else if(!G&&Date.now()-(NET.ckAt||0)>600000){NET.ckAt=Date.now();cloudCheck();}});
